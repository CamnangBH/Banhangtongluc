<title>Điều hành Bán hàng Tổng lực</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style id="app-css">
/* Layout: VNPT-blue brand band → filter rail → tabbed analysis canvas (summary tiles, then charts, then tables) on a cool, blue-tinted grey */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface-2:#edf1f7; --fg:#0e1a2b; --muted:#566275; --faint:#8692a4; --line:#dce3ed;
  --accent:#0060af; --accent-2:#0a4f8f; --accent-soft:#e2edf9; --accent-ink:#ffffff;
  --band:#0060af; --band-2:#004f91; --band-fg:#ffffff; --band-muted:#c9def3;
  --good:#1b7f37; --good-soft:#e1f3e6; --warn:#a96500; --warn-soft:#fcf0d9; --bad:#c42d29; --bad-soft:#fbe5e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6; --plan:#a3adbb; --neutral:#bcc5d1;
  --heat:#0060af;
  --shadow:0 1px 2px rgba(14,26,43,.06);
  --font-display:'Lexend','Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d131b; --surface:#151d28; --surface-2:#1c2633; --fg:#e7edf4; --muted:#9eabbd; --faint:#7a879a; --line:#283444;
  --accent:#4a97e6; --accent-2:#6aaaf0; --accent-soft:#16304d; --accent-ink:#0d131b;
  --band:#0b3a68; --band-2:#082e54; --band-fg:#f2f7fc; --band-muted:#a9c6e4;
  --good:#45b665; --good-soft:#15301f; --warn:#e3a43a; --warn-soft:#352812; --bad:#ef6a66; --bad-soft:#3a1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --plan:#5f6c7e; --neutral:#4a5668;
  --heat:#4a97e6; --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d131b; --surface:#151d28; --surface-2:#1c2633; --fg:#e7edf4; --muted:#9eabbd; --faint:#7a879a; --line:#283444;
  --accent:#4a97e6; --accent-2:#6aaaf0; --accent-soft:#16304d; --accent-ink:#0d131b;
  --band:#0b3a68; --band-2:#082e54; --band-fg:#f2f7fc; --band-muted:#a9c6e4;
  --good:#45b665; --good-soft:#15301f; --warn:#e3a43a; --warn-soft:#352812; --bad:#ef6a66; --bad-soft:#3a1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --plan:#5f6c7e; --neutral:#4a5668;
  --heat:#4a97e6; --shadow:none; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1640px;margin:0 auto;padding-inline:20px}
@media (max-width:600px){.wrap{padding-inline:16px}}
.num{font-variant-numeric:tabular-nums}

/* Header band */
.band{background:linear-gradient(180deg,var(--band),var(--band-2));color:var(--band-fg)}
.band .wrap{padding-block:18px 16px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.brand-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--band-fg);display:grid;place-items:center;font:700 10px var(--font-display);color:var(--band-fg)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.2;margin:6px 0 4px;text-wrap:balance;letter-spacing:.005em}
.meta{font-size:12.5px;color:var(--band-muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--band-fg);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.band .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:var(--band-fg)}
.band .btn:hover{background:rgba(255,255,255,.2);color:var(--band-fg)}
.band .btn.primary{background:var(--band-fg);color:var(--band-2);border-color:var(--band-fg)}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm{padding:4px 9px;font-size:12px}

/* Filter rail */
.rail{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:var(--shadow)}
.rail .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--fg);max-width:240px}
.fbtn .v{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.fbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.fbtn.on .v{color:var(--accent);font-weight:600}
.fbtn .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--faint)}
.dates{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.dates input{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;font-size:12px;color:var(--muted);max-width:100%}
.chip b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--faint);font-size:14px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--bad)}
.more{display:none;flex-wrap:wrap;gap:8px 10px;align-items:center}
.more.open{display:flex}
.setting{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.setting select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:12px;max-width:260px}

/* Popover */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,35,.18);width:320px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;max-height:min(460px,70vh)}
.pop-h{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pop-h input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface-2);font-size:13px}
.pop-acts{display:flex;gap:6px;justify-content:space-between;font-size:12px;color:var(--muted);align-items:center}
.pop-acts button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:0}
.pop-list{overflow:auto;padding:4px 0}
.opt{display:flex;gap:8px;align-items:center;padding:5px 12px;cursor:pointer;font-size:13px}
.opt:hover{background:var(--surface-2)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .c{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.opt.zero .t{color:var(--faint)}
.opt input{accent-color:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab small{font-weight:500;color:var(--faint);margin-right:4px;font-size:11px}
main{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

/* Cards and grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.card-h h3{margin:0;font:600 15px/1.3 var(--font-display);text-wrap:balance}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:3px;max-width:75ch}
h2.sec{font:600 17px/1.3 var(--font-display);margin:10px 0 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec span{font:400 12.5px var(--font-body);color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g-wide{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:320px}
.chart.tall{height:400px}
.nochart{display:grid;place-items:center;height:100%;color:var(--faint);font-size:13px;text-align:center;padding:12px}

/* KPI tiles */
.kpis{display:grid;--kc:var(--n,4);grid-template-columns:repeat(var(--kc),minmax(0,1fr));gap:12px}
@media (max-width:1279px){.kpis{--kc:var(--half,4)}}
@media (max-width:640px){.kpis{--kc:2}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);position:relative}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font:600 24px/1.15 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kpi.good{border-top:3px solid var(--good)} .kpi.warn{border-top:3px solid var(--warn)} .kpi.bad{border-top:3px solid var(--bad)} .kpi.acc{border-top:3px solid var(--accent)}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.na{background:var(--surface-2);color:var(--muted)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600} .flat{color:var(--muted)}

/* Tables */
.tw{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t th.n,.t td.n{text-align:right}
.t th[data-sort]{cursor:pointer;user-select:none}
.t th[data-sort]:hover{color:var(--accent)}
.t th .ar{font-size:9px;margin-left:3px;color:var(--accent)}
.t td.n{white-space:nowrap}
.t td b{white-space:nowrap}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr.click{cursor:pointer}
.t tr.sel td{background:var(--accent-soft)}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.t td.wrap{white-space:normal;min-width:200px}
.cell-good{color:var(--good);font-weight:700} .cell-warn{color:var(--warn);font-weight:700} .cell-bad{color:var(--bad);font-weight:700}
.rowbar{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.rowbar i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.scroll-y{max-height:460px;overflow:auto}
.heat td.h{text-align:right;min-width:46px}
.heat th.c{text-align:right}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:90px;gap:1px;background:var(--surface-2)}
.mix span{display:block;height:100%}

/* Bar lists */
.bl{display:flex;flex-direction:column;gap:7px}
.bl-r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:12.8px}
.bl-r .lb{overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;min-width:0}
.bl-r .tr{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bl-r .tr i{display:block;height:100%;border-radius:4px}
.bl-r .vl{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--muted)}
.bl-r .vl b{color:var(--fg);font-weight:600}

/* Insights */
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.in{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;min-width:0}
.in .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;display:block;margin-bottom:2px}
.in .mk{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--accent)}
.in.good .mk{background:var(--good)} .in.warn .mk{background:var(--warn)} .in.bad .mk{background:var(--bad)}
.in div{min-width:0;overflow-wrap:anywhere}

/* Status strip */
.strip{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.strip span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.grp{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0;background:var(--surface)}
.grp h4{margin:0 0 4px;font:600 13.5px var(--font-display);display:flex;align-items:center;gap:8px}
.grp p{margin:0 0 8px;font-size:12px;color:var(--muted)}
.grp .list{display:flex;flex-wrap:wrap;gap:6px}
.grp .badge{white-space:normal;max-width:100%}
.grp.good{border-top:3px solid var(--good)} .grp.warn{border-top:3px solid var(--warn)} .grp.bad{border-top:3px solid var(--bad)} .grp.q{border-top:3px solid var(--s4)}

.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.note b{color:var(--fg)}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:12.8px}
.warnbox b{color:var(--warn)}
.formula{font-size:12.5px;background:var(--surface-2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0}
.empty{padding:28px 12px;text-align:center;color:var(--faint);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--surface);font-size:12.5px;min-width:0;width:220px;max-width:100%}
.toolbar select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-size:12.5px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}
.loading{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;z-index:70;font-weight:600}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--muted)}
.subtab.on{color:var(--fg);border-color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.8px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.hide-sm{}
@media (max-width:900px){.rail{position:static}}
@media (max-width:600px){.hide-sm{display:none}.chart{height:280px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--band-muted);padding:0 4px}
.who b{color:var(--band-fg)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--band) 0%,var(--band-2) 55%,var(--bg) 55.1%)}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 50px rgba(5,25,50,.25)}
.login-card h2{font:700 20px/1.25 var(--font-display);margin:10px 0 0;text-wrap:balance}
.login-card p{margin:0 0 12px;color:var(--muted);font-size:13px}
.login-card label{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}
.login-card input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);font-size:14px;width:100%}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.login-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.btn.primary-solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);justify-content:center;padding:11px;font-size:14px;font-weight:600;margin-top:14px}
.btn.primary-solid:hover{background:var(--accent-2);color:var(--accent-ink)}
.btn.primary-solid:disabled{opacity:.6;cursor:wait}
</style>
<div id="app">
<div class="login" id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand" style="color:var(--accent)"><span class="brand-mark" style="border-color:var(--accent);color:var(--accent)">V</span>VNPT Hải Phòng</div>
    <h2>Dashboard điều hành bán hàng tổng lực</h2>
    <p>Tháng 10/2026 · Đăng nhập để xem báo cáo</p>
    <label for="lgUser">Tên đăng nhập</label>
    <input id="lgUser" name="username" autocomplete="username" required>
    <label for="lgPass">Mật khẩu</label>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" required>
    <div class="login-err" id="lgErr" hidden></div>

/* ============ DATE PARSING ============ */
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==='number' && isFinite(v)){ // Excel serial
    const d=new Date(Math.round((v-25569)*864e5)); if(isNaN(d)) return null;
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m){ const d=+m[1],mo=+m[2],y=+m[3]; if(mo<1||mo>12||d<1||d>31) return null; return `${y}-${pad(mo)}-${pad(d)}`; }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(/^\d+(\.\d+)?$/.test(s)) return parseDate(+s);
  return null;
}
function parseNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; const s=String(v).trim().replace(/\s/g,'').replace(',', '.'); const n=Number(s); return isFinite(n)?n:null; }

function decodeEmbedded(D){
  const rows=new Array(D.n);
  for(let i=0;i<D.n;i++){ const r=new Array(D.cols.length); for(let j=0;j<D.cols.length;j++){ const c=D.cols[j]; r[j]=c.u[c.i[i]]; } rows[i]=r; }
  return {source:D.source, detail:[D.header,...rows], plan:D.plan, conv:D.conv, loadedAt:new Date(), embedded:true};
}

function normalize(raw){
  const warns=[]; const chk={};
  // ---- Quy đổi
  const coef={}; const convRows=[];
  for(const r of (raw.conv||[])){
    const cells=(r||[]).filter(v=>v!=null&&v!=='');
    if(cells.length<2) continue;
    const name=clean(cells[0]); const val=parseNum(cells[1]);
    if(val==null) continue;
    const g = SVC.find(x=>fold(x)===fold(name)) || SVC_MAP[fold(name)];
    convRows.push({name, val, g:g||null});
    if(g) coef[g]=val; else warns.push({lv:'warn',t:`Sheet Quy đổi có dịch vụ “${name}” không thuộc nhóm Fiber/MyTV/Mesh/Cam — chưa sử dụng, cần đối chiếu.`});
  }
  for(const g of SVC) if(coef[g]==null) warns.push({lv:'bad',t:`Không tìm thấy hệ số quy đổi cho ${g} trong sheet Quy đổi — điểm của ${g} đang tính bằng 0, cần bổ sung.`});
  // ---- Kế hoạch
  const plan={}; const planAreas=[]; let planTotalRow=null; const planRows=[];
  const P=raw.plan||[]; let hi=-1, col={};
  for(let i=0;i<P.length;i++){ const r=P[i]||[]; const fs=r.map(fold); if(fs.includes('fiber')&&fs.includes('mytv')){ hi=i; fs.forEach((f,j)=>{ if(f==='fiber')col.Fiber=j; else if(f==='mytv')col.MyTV=j; else if(f==='mesh')col.Mesh=j; else if(f==='cam'||f==='camera')col.Cam=j; else if(f.startsWith('tong tb'))col.tb=j; else if(f.startsWith('tong diem'))col.pts=j; }); break; } }
  let nameCol=1; if(P[0]){ const j=P[0].findIndex(v=>fold(v).startsWith('dia ban')); if(j>=0) nameCol=j; }
  if(hi<0) warns.push({lv:'bad',t:'Không đọc được dòng tiêu đề Fiber/MyTV/Mesh/Cam trong sheet Kế hoạch.'});
  else for(let i=hi+1;i<P.length;i++){
    const r=P[i]||[]; const name=clean(r[nameCol]); if(!name) continue;
    const o={name}; SVC.forEach(g=>o[g]=parseNum(r[col[g]])||0); o.tb=parseNum(r[col.tb]); o.filePts=parseNum(r[col.pts]);
    o.coefPts=SVC.reduce((s,g)=>s+o[g]*(coef[g]||0),0);
    o.camFilePts = o.filePts!=null ? o.filePts-(o.Fiber*(coef.Fiber||0)+o.MyTV*(coef.MyTV||0)+o.Mesh*(coef.Mesh||0)) : null;
    if(fold(name)==='hpg'||fold(name).startsWith('tong')){ planTotalRow=o; continue; }
    plan[name]=o; planAreas.push(name); planRows.push(o);
  }
  // plan consistency
  const ptsDiff=planRows.filter(o=>o.filePts!=null&&Math.abs(o.filePts-o.coefPts)>0.05);
  if(ptsDiff.length){
    const ex=ptsDiff[0]; const impl = ex.Cam? ex.camFilePts/ex.Cam : null;
    warns.push({lv:'warn',key:'plancoef',t:`Cột “Tổng điểm quy đổi” sheet Kế hoạch lệch với hệ số sheet Quy đổi ở ${ptsDiff.length}/${planRows.length} địa bàn. Ví dụ ${ex.name}: file ${fP(ex.filePts)} điểm, tính theo hệ số ${fP(ex.coefPts)} điểm${impl!=null?` (cột tổng đang ngầm dùng hệ số Cam ≈ ${nf1.format(impl)} thay vì ${nf1.format(coef.Cam)})`:''}. Dashboard không sửa chỉ tiêu thuê bao; dùng ô “Điểm kế hoạch” trên thanh lọc để chọn cách tính.`});
  }
  const tbDiff=planRows.filter(o=>o.tb!=null&&Math.abs(o.tb-SVC.reduce((s,g)=>s+o[g],0))>0.01);
  if(tbDiff.length) warns.push({lv:'warn',t:`Cột “Tổng TB/ngày” không bằng tổng 4 dịch vụ ở ${tbDiff.length} địa bàn: ${tbDiff.map(o=>o.name).join(', ')}.`});
  if(planTotalRow){ const sumF=planRows.reduce((s,o)=>s+(o.filePts||0),0); if(planTotalRow.filePts!=null&&Math.abs(sumF-planTotalRow.filePts)>0.1) warns.push({lv:'warn',t:`Dòng tổng ${planTotalRow.name} (${fP(planTotalRow.filePts)} điểm) khác tổng các địa bàn (${fP(sumF)}).`}); }
  const areaByFold={}; planAreas.forEach(a=>areaByFold[fold(a)]=a);

  // ---- Chi tiết
  const D=raw.detail||[]; const H=(D[0]||[]).map(fold); const ci={};
  for(const [k,name] of Object.entries(COLS)){ const j=H.indexOf(fold(name)); ci[k]=j; if(j<0) warns.push({lv:'bad',t:`Sheet Chi tiết thiếu cột “${name}”.`}); }
  const g = (r,k) => ci[k]>=0 ? r[ci[k]] : null;
  const rows=[]; const bad=[]; const unitMap=new Map(); const svcUnknown=new Map();
  let nRead=0,nBadDate=0,nUnkSvc=0,nUnkArea=0,nTrim=0,nPPtext=0,nOutMonth=0,nNoTech=0,nNoWard=0,nNoStreet=0,nNoPP=0;
  const seen=new Map(); let dupRows=0; const dupGroups=new Map();
  for(let i=1;i<D.length;i++){
    const r=D[i]; if(!r||r.every(v=>v==null||v==='')) continue; nRead++;
    const key=JSON.stringify(r); if(seen.has(key)){ dupRows++; dupGroups.set(key,(dupGroups.get(key)||1)+1); } else seen.set(key,i);
    const rawHt=g(r,'ht'); if(rawHt!=null && String(rawHt)!==clean(rawHt)) nTrim++;
    const d=parseDate(g(r,'date'));
    const svcRaw=clean(g(r,'svc')); const grp=SVC_MAP[fold(svcRaw)]||null;
    const unit=clean(g(r,'unit'));
    let area=UNK, utype='Đơn vị chức năng / khác';
    const fu=fold(unit);
    let base=null;
    if(fu.startsWith('trung tam vien thong ')){ base=fu.slice(21); utype='Trung tâm Viễn thông'; }
    else if(fu.startsWith('ttvt ')){ base=fu.slice(5); utype='Trung tâm Viễn thông'; }
    else if(fu.startsWith('vnpt ')){ base=fu.slice(5); utype='VNPT khu vực'; }
    if(base!=null && areaByFold[base]) area=areaByFold[base];
    if(!unitMap.has(unit)) unitMap.set(unit,{unit:unit||'(trống)',area,utype,n:0});
    unitMap.get(unit).n++;
    const ppRaw=g(r,'prepay'); let pp, ppk;
    if(ppRaw==null||clean(ppRaw)===''){ pp=ND; ppk=999; nNoPP++; }
    else { const n=parseNum(ppRaw); if(n!=null && /^\s*\d+([.,]\d+)?\s*$/.test(String(ppRaw))){ if(typeof ppRaw==='string') nPPtext++; pp=fN(n)+' tháng'; ppk=n; } else { pp=clean(ppRaw); ppk= fold(pp)==='hang thang'?0:500; } }
    const cnRaw=clean(g(r,'cn')); if(!cnRaw) nNoTech++;
    const ward=clean(g(r,'ward'))||ND, street=clean(g(r,'street'))||ND;
    if(ward===ND) nNoWard++; if(street===ND) nNoStreet++;
    const ec=clean(g(r,'ec')), en=clean(g(r,'en'));
    const rec={i, hd:clean(g(r,'hd')), d, tl:d?TL_DAYS.includes(d):false, svc:svcRaw||ND, g:grp, pkg:clean(g(r,'pkg'))||ND,
      lap:clean(g(r,'lap'))||ND, pp, ppk, ec, en, emp:(ec||en)?`${en||'?'} (${ec||'?'})`:ND, unit:unit||'(trống)', area, st:clean(g(r,'st'))||ND,
      ward, street, kh:clean(g(r,'kh'))||ND, ht:clean(g(r,'ht'))||ND, cn:cnRaw||ND};
    rec.ws = ward+' › '+street;
    rec.pts = grp ? (coef[grp]||0) : 0;
    if(!d){ nBadDate++; rec.why='Không xác định ngày'; bad.push(rec); continue; }
    if(!grp){ nUnkSvc++; svcUnknown.set(svcRaw,(svcUnknown.get(svcRaw)||0)+1); rec.why='Không xác định dịch vụ'; bad.push(rec); continue; }
    if(!d.startsWith('2026-10')) nOutMonth++;
    if(area===UNK){ nUnkArea++; continue; }
    rows.push(rec);
  }
  // contracts
  const hdCount=new Map(); rows.forEach(r=>hdCount.set(r.hd,(hdCount.get(r.hd)||0)+1));
  const multi=[...hdCount.values()].filter(v=>v>1).length;
  if(nBadDate) warns.push({lv:'bad',t:`${fN(nBadDate)} dòng không xác định được ngày lập hợp đồng — đã loại khỏi phân tích, xem ở mục Tra cứu.`});
  if(nUnkSvc) warns.push({lv:'bad',t:`${fN(nUnkSvc)} dòng có tên dịch vụ không khớp bảng quy đổi (${[...svcUnknown.keys()].join(', ')}) — chưa gán hệ số, cần đối chiếu.`});
  if(dupRows) warns.push({lv:'warn',t:`${fN(dupRows)} dòng trùng hoàn toàn với một dòng khác (${fN(dupGroups.size)} nhóm). Có thể là nhiều thiết bị cùng loại trên một hợp đồng (ví dụ nhiều Camera/Mesh); dashboard giữ nguyên, không tự xóa — cần đối chiếu nếu nghi nhập trùng.`});
  if(nTrim) warns.push({lv:'info',t:`${fN(nTrim)} giá trị “Hình thức” có khoảng trắng thừa (ví dụ “Moi ”) — đã chuẩn hóa về “Moi”.`});
  if(nPPtext) warns.push({lv:'info',t:`${fN(nPPtext)} giá trị “Tháng trả trước” lưu dạng chữ số văn bản (ví dụ "13") — đã gộp với giá trị số tương ứng.`});
  if(nOutMonth) warns.push({lv:'warn',t:`${fN(nOutMonth)} thuê bao có ngày ngoài tháng 10/2026.`});
  if(!planAreas.length) warns.push({lv:'bad',t:'Sheet Kế hoạch không có địa bàn nào — không thể so sánh với kế hoạch.'});
  const dates=[...new Set(rows.map(r=>r.d))].sort();
  Object.assign(chk,{nRead,nValid:rows.length,nBadDate,nUnkSvc,nUnkArea,dupRows,dupGroups:dupGroups.size,multi,nHd:hdCount.size,nTrim,nPPtext,nNoTech,nNoWard,nNoStreet,nNoPP,nOutMonth});
  const dupList=[...dupGroups.entries()].map(([k,c])=>{const a=JSON.parse(k);return {hd:a[ci.hd],svc:a[ci.svc],pkg:a[ci.pkg],date:a[ci.date],unit:a[ci.unit],c};}).sort((a,b)=>b.c-a.c);
  return {rows,bad,coef,convRows,plan,planAreas,planRows,planTotalRow,unitMap:[...unitMap.values()].sort((a,b)=>a.area.localeCompare(b.area,'vi')||a.unit.localeCompare(b.unit,'vi')),warns,chk,dates,dupList,
    source:raw.source, loadedAt:raw.loadedAt||new Date(), processedAt:new Date(), embedded:!!raw.embedded};
}

/* ============ FILTERING ============ */
function passDate(r){
  if(S.from && r.d<S.from) return false;
  if(S.to && r.d>S.to) return false;
  if(S.scope==='tl') return r.tl && S.tlDays.has(r.d);
  if(S.scope==='non') return !r.tl;
  return !r.tl || S.tlDays.has(r.d);
}
function passOther(r,skip){
  for(const k of FKEYS){ if(k===skip) continue; const s=S.f[k]; if(s.size && !s.has(r[k])) return false; }
  return true;
}
function planDays(){
  if(S.scope==='non') return [];
  return TL_DAYS.filter(d=>S.tlDays.has(d)&&(!S.from||d>=S.from)&&(!S.to||d<=S.to));
}
function planAreasSel(){ return DB.planAreas.filter(a=>!S.f.area.size||S.f.area.has(a)); }
function planSvcsSel(){ if(!S.f.svc.size) return SVC.slice(); const s=new Set(); S.f.svc.forEach(v=>{const g=SVC_MAP[fold(v)]; if(g) s.add(g);}); return SVC.filter(g=>s.has(g)); }
function planPtsDay(a,g){ const p=DB.plan[a]; if(!p) return 0; if(S.planMode==='file'&&g==='Cam'&&p.camFilePts!=null) return p.camFilePts; return p[g]*(DB.coef[g]||0); }
function planPts(areas,svcs,nd){ let s=0; for(const a of areas) for(const g of svcs) s+=planPtsDay(a,g); return s*nd; }
function planSubs(areas,svcs,nd){ let s=0; for(const a of areas) for(const g of svcs) s+=(DB.plan[a]?DB.plan[a][g]:0); return s*nd; }

let CX=null;
function computeCtx(){
  const F=[],Fns=[],Fnd=[]; const stOn=S.f.st.size>0;
  for(const r of DB.rows){
    const pd=passDate(r);
    if(passOther(r,null)){ Fnd.push(r); if(pd) F.push(r); }
    if(stOn && pd && passOther(r,'st')) Fns.push(r);
  }
  const days=planDays();
  CX={F, Fns:stOn?Fns:F, Fnd, FTL:F.filter(r=>r.tl), days, areas:planAreasSel(), svcs:planSvcsSel(), stOn};
  // network level
  const tot=accum(CX.F); const ns=accum(CX.Fns);
  CX.tot=tot; CX.ns=ns; CX.ttRate=ratio(ns.tt,ns.n); CX.ttRateExt=ratio(ns.tt+ns.ttt,ns.n);
  CX.planPts=planPts(CX.areas,CX.svcs,days.length);
  CX.actTL=accum(CX.FTL);
  CX.hd=new Set(CX.F.map(r=>r.hd)).size;
  CX.areaStats=areaStats();
  return CX;
}
function newAcc(){ return {n:0,pts:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},tt:0,ttt:0,st:{}}; }
function addAcc(o,r){ o.n++; o.pts+=r.pts; o.svc[r.g]++; o.st[r.st]=(o.st[r.st]||0)+1; if(r.st===ST_TT)o.tt++; else if(r.st===ST_TTT)o.ttt++; }
function accum(rows){ const o=newAcc(); for(const r of rows) addAcc(o,r); return o; }
function groupBy(rows,keyFn){ const m=new Map(); for(const r of rows){ const k=keyFn(r); let o=m.get(k); if(!o){o=newAcc();o.k=k;m.set(k,o);} addAcc(o,r);} return m; }
function areaStats(){
  const m=new Map(); const mk=a=>({area:a,n:0,pts:0,ptsTL:0,nTL:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},svcTL:{Fiber:0,MyTV:0,Mesh:0,Cam:0},nNs:0,tt:0,ttt:0,gtc:0,inPlan:!!DB.plan[a]});
  CX.areas.forEach(a=>m.set(a,mk(a)));
  for(const r of CX.F){ let o=m.get(r.area); if(!o){o=mk(r.area);m.set(r.area,o);} o.n++; o.pts+=r.pts; o.svc[r.g]++; if(r.tl){o.ptsTL+=r.pts;o.nTL++;o.svcTL[r.g]++;} if(r.st==='Đã giao thi công')o.gtc++; }
  for(const r of CX.Fns){ let o=m.get(r.area); if(!o){o=mk(r.area);m.set(r.area,o);} o.nNs++; if(r.st===ST_TT)o.tt++; else if(r.st===ST_TTT)o.ttt++; }
  const nd=CX.days.length; const list=[...m.values()];
  for(const o of list){
    o.plan=o.inPlan?planPts([o.area],CX.svcs,nd):0;
    o.rate=o.plan>0?o.ptsTL/o.plan:null; o.gap=o.ptsTL-o.plan;
    o.ttRate=ratio(o.tt,o.nNs); o.ttRateExt=ratio(o.tt+o.ttt,o.nNs);
    o.svcPlan={}; SVC.forEach(g=>o.svcPlan[g]=o.inPlan&&CX.svcs.includes(g)?planSubs([o.area],[g],nd):0);
  }

const TABLES={};
function sortTable(id,cols,data,opt={}){

function tableHTML(id){

  const foot=opt.foot?`<tfoot><tr>${cols.map(c=>`<td class="${c.num?'n':''}">${opt.foot[c.k]!=null?opt.foot[c.k]:''}</td>`).join('')}</tr></tfoot>`:'';
  return `<table class="t"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${foot}</table>`+(opt.limit&&rows.length>opt.limit?`<div class="note" style="margin-top:6px">Hiển thị ${opt.limit}/${fN(rows.length)} dòng theo thứ tự đang sắp xếp.</div>`:'');

const DIMS={

function dimValues(rows,dim,top){
  const D=DIMS[dim]; const cnt=new Map(); const ppk=new Map();
  for(const r of rows){ const v=D.k(r); if(v==null) continue; cnt.set(v,(cnt.get(v)||0)+1); if(D.sortBy) ppk.set(v,r[D.sortBy]); }
  let vals=[...cnt.keys()];
  if(D.order){ const o=D.order(); vals.sort((a,b)=>{const ia=o.indexOf(a),ib=o.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib);}); }
  else if(D.sortBy) vals.sort((a,b)=>ppk.get(a)-ppk.get(b));
  else vals.sort((a,b)=>cnt.get(b)-cnt.get(a));
  if(top&&vals.length>top&&!D.order){ vals=vals.slice(0,top); }
  return {vals,cnt};
}
function crossCard(id,title,sub,rows,rowDim,colDims,opt={}){
  const st=S.cross[id]||(S.cross[id]={dim:colDims[0],mode:opt.mode||'n'});
  if(!colDims.includes(st.dim)) st.dim=colDims[0];
  const colDim=st.dim; const RD=DIMS[rowDim], CD=DIMS[colDim];
  const R=dimValues(rows,rowDim,opt.topRows), C=dimValues(rows,colDim,opt.topCols||14);
  const rs=new Set(R.vals), cs=new Set(C.vals);
  const m=new Map(); const rowT=new Map(), colT=new Map(); let T=0;
  for(const r of rows){ const a=RD.k(r), b=CD.k(r); if(a==null||b==null||!rs.has(a)||!cs.has(b)) continue; const key=a+'\u0001'+b; m.set(key,(m.get(key)||0)+1); rowT.set(a,(rowT.get(a)||0)+1); colT.set(b,(colT.get(b)||0)+1); T++; }
  let max=0; const val=(a,b)=>{ const n=m.get(a+'\u0001'+b)||0; if(st.mode==='row') return ratio(n,rowT.get(a)); if(st.mode==='col') return ratio(n,colT.get(b)); return n; };
  R.vals.forEach(a=>C.vals.forEach(b=>{ const v=val(a,b)||0; if(v>max) max=v; }));
  const fmt=v=> st.mode==='n'? (v?fN(v):'<span style="color:var(--faint)">·</span>') : (v?fR(v):'<span style="color:var(--faint)">·</span>');
  const cell=(a,b)=>{ const v=val(a,b)||0; const al=max?Math.round(v/max*42):0; const n=m.get(a+'\u0001'+b)||0; return `<td class="h" style="background:color-mix(in srgb, var(--heat) ${al}%, transparent)" title="${esc(RD.lab?lab(a):a)} × ${esc(CD.lab?lab(b):b)}: ${fN(n)} thuê bao${st.mode!=='n'?' · '+fR(v):''}">${fmt(v)}</td>`; };
  const L=(D,v)=>esc(D.lab?lab(v):v);
  const body = (!R.vals.length||!C.vals.length) ? `<div class="empty">Không có dữ liệu trong phạm vi lọc</div>` :
    `<div class="tw ${opt.scroll===false?'':'scroll-y'}"><table class="t heat"><thead><tr><th>${RD.t} \\ ${CD.t}</th>${C.vals.map(b=>`<th class="c">${L(CD,b)}</th>`).join('')}<th class="c">Tổng</th></tr></thead><tbody>${R.vals.map(a=>`<tr><td>${L(RD,a)}</td>${C.vals.map(b=>cell(a,b)).join('')}<td class="n"><b>${fN(rowT.get(a)||0)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>Tổng</td>${C.vals.map(b=>`<td class="n">${fN(colT.get(b)||0)}</td>`).join('')}<td class="n">${fN(T)}</td></tr></tfoot></table></div>`;
  const ctrls=`<div class="toolbar">${colDims.length>1?seg('cross:'+id+':dim',colDims.map(d=>[d,DIMS[d].t]),colDim):''}${seg('cross:'+id+':mode',[['n','Số lượng'],['row','% theo dòng'],['col','% theo cột']],st.mode)}</div>`;
  const notes=[]; if(opt.topRows&&R.vals.length>=opt.topRows) notes.push(`${opt.topRows} ${RD.t.toLowerCase()} lớn nhất`); if(C.vals.length>=(opt.topCols||14)&&!CD.order) notes.push(`${opt.topCols||14} ${CD.t.toLowerCase()} lớn nhất`);
  return card(title,(sub||'')+(notes.length?` Hiển thị ${notes.join(', ')}.`:''),body,ctrls);
}

function disposeDetached(){ CHARTS.forEach(el=>{ if(!document.body.contains(el)){ const c=window.echarts&&echarts.getInstanceByDom(el); if(c) c.dispose(); CHARTS.delete(el);} }); }

/* stacked service bars per category (+ total label) */
function chartStackSvc(id,cats,bySvc,opt={}){
  const c=ch(id,opt.h); if(!c) return; const t=T();
  const totals=cats.map((_,i)=>SVC.reduce((s,g)=>s+(bySvc[g][i]||0),0));
  const series=SVC.map(g=>({name:g,type:'bar',stack:'s',barMaxWidth:46,data:bySvc[g],itemStyle:{color:t.s[g],borderColor:t.surface,borderWidth:1},emphasis:{focus:'series'},
    label:{show:true,position:'inside',color:'#fff',fontSize:10.5,formatter:p=>p.value>=Math.max(...totals)*0.07?fN(p.value):''}}));
  series.push({name:'Tổng',type:'bar',stack:'s',data:cats.map(()=>0),itemStyle:{color:'transparent'},label:{show:true,position:'top',color:t.fg,fontWeight:600,fontSize:12,formatter:p=>fN(totals[p.dataIndex])},tooltip:{show:false}});
  c.setOption(Object.assign(baseOpt(t),{
    legend:Object.assign(baseOpt(t).legend,{data:SVC}),
    tooltip:Object.assign(baseOpt(t).tooltip,{formatter:ps=>{ const i=ps[0].dataIndex; const tot=totals[i]; let h=`<b>${cats[i]}</b> · Tổng ${fN(tot)} thuê bao<br>`; ps.filter(p=>p.seriesName!=='Tổng').forEach(p=>h+=tipRow(p.color,p.seriesName,`${fN(p.value)} · ${fR(ratio(p.value,tot))}`)); if(opt.prev&&i>0) h+=`<div style="margin-top:4px;color:${t.muted}">So với ${cats[i-1]}: ${fSigned(tot-totals[i-1])} (${fR(ratio(tot-totals[i-1],totals[i-1]))})</div>`; return h; }}),
    xAxis:xCat(t,cats,opt.rotate?{axisLabel:{color:t.muted,fontSize:11,rotate:opt.rotate}}:null), yAxis:yVal(t), series}),true);
}

/* ============ TAB 1: OVERVIEW ============ */
function dayStats(){
  const days=CX.days; const by=new Map(days.map(d=>[d,{d,n:0,pts:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},nNs:0,tt:0,ttt:0}]));
  for(const r of CX.FTL){ const o=by.get(r.d); if(!o) continue; o.n++; o.pts+=r.pts; o.svc[r.g]++; }
  for(const r of CX.Fns){ const o=by.get(r.d); if(!o||!r.tl) continue; o.nNs++; if(r.st===ST_TT)o.tt++; else if(r.st===ST_TTT)o.ttt++; }
  const pd=planPts(CX.areas,CX.svcs,1);
  return days.map(d=>{const o=by.get(d); o.plan=pd; o.rate=ratio(o.pts,pd); return o;});
}
function svcCompletion(){
  return SVC.filter(g=>CX.svcs.includes(g)).map(g=>{ const a=CX.FTL.filter(r=>r.g===g&&CX.areas.includes(r.area)).length; const p=planSubs(CX.areas,[g],CX.days.length); return {g,a,p,rate:ratio(a,p)}; });
}
function renderOverview(){
  const c=CX, t=c.tot, ds=dayStats();
  const AS=c.areaStats.filter(o=>o.inPlan&&o.plan>0);
  const nOk=AS.filter(o=>o.rate>=1).length, nNo=AS.filter(o=>o.rate<1).length;
  const rate=ratio(c.actTL.pts,c.planPts);
  const scopeNote = S.scope==='all' ? `Điểm so kế hoạch chỉ tính ${fN(c.actTL.n)} thuê bao trong ngày tổng lực.` : S.scope==='non' ? 'Ngày thường không có kế hoạch giao.' : '';
  const kp=[
    kpi('Tổng sản lượng dịch vụ',fN(t.n),`thuê bao · ${fN(c.hd)} hợp đồng duy nhất`,'acc'),
    kpi('Điểm quy đổi thực hiện',fP(S.scope==='tl'?t.pts:c.actTL.pts),S.scope==='tl'?`${c.days.length} ngày tổng lực`:`ngày tổng lực · cả phạm vi ${fP(t.pts)}`,'acc'),
    kpi('Điểm kế hoạch tương ứng',fP(c.planPts),`${c.days.length} ngày × KH ngày ${fP(planPts(c.areas,c.svcs,1))}`),
    kpi('Tỷ lệ hoàn thành KH điểm',fR(rate),rate==null?'Không có kế hoạch trong phạm vi':`Chênh lệch ${fSigned(c.actTL.pts-c.planPts,1)} điểm`,rateCls(rate)),
    kpi('Địa bàn đạt / vượt KH',`${nOk}<span style="font-size:14px;color:var(--muted)"> / ${AS.length}</span>`,'hoàn thành ≥ 100%',nOk?'good':''),
    kpi('Địa bàn chưa đạt KH',`${nNo}<span style="font-size:14px;color:var(--muted)"> / ${AS.length}</span>`,`trong đó dưới 80%: ${AS.filter(o=>o.rate<0.8).length}`,nNo?'bad':''),
    kpi('Sản lượng thoái trả',fN(c.ns.tt),`+ ${fN(c.ns.ttt)} thoái trả tạm`, c.ns.tt?'warn':''),
    kpi('Tỷ lệ thoái trả',fR(c.ttRate),`mở rộng (gồm TT tạm): ${fR(c.ttRateExt)}`, c.ttRate>0.08?'bad':c.ttRate>0.04?'warn':'good'),
  ].join('');
  const planNote=[]; const nonPlanF=['pkg','pp','st','lap','kh','ht','cn','ward','street','emp'].filter(k=>S.f[k].size).map(k=>FDEFS.find(d=>d.k===k).label);
  if(nonPlanF.length) planNote.push(`Kế hoạch chỉ phân bổ theo ngày, địa bàn và dịch vụ; bộ lọc ${nonPlanF.join(', ')} chỉ thu hẹp sản lượng thực hiện, không thu hẹp kế hoạch.`);
  if(scopeNote) planNote.push(scopeNote);
  if(c.stOn) planNote.push('Đang lọc trạng thái: sản lượng/điểm tính theo trạng thái được chọn; chỉ tiêu thoái trả tính trên toàn bộ trạng thái để giữ đúng mẫu số.');
  // status strip
  const stC={ 'Đã hoàn thành':'var(--good)','Đã giao thi công':'var(--s1)','Đã thanh toán':'var(--s3)','Thoái trả':'var(--bad)','Thoái trả tạm':'var(--warn)'};
  const stAll=Object.entries(c.ns.st).sort((a,b)=>{const ia=ST_ORDER.indexOf(a[0]),ib=ST_ORDER.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib);});
  const strip=`<div class="strip">${stAll.map(([s,n])=>`<span style="width:${n/c.ns.n*100}%;background:${stC[s]||'var(--neutral)'}" title="${esc(s)}: ${fN(n)} (${fR(n/c.ns.n)})">${n/c.ns.n>0.06?fR(n/c.ns.n):''}</span>`).join('')}</div><div class="legend">${stAll.map(([s,n])=>`<span><i class="dot" style="background:${stC[s]||'var(--neutral)'}"></i>${esc(s)} <b class="num" style="color:var(--fg)">${fN(n)}</b> (${fR(n/c.ns.n)})</span>`).join('')}</div>`;

  // adjacent pairs
  const pairs=[]; for(let i=1;i<ds.length;i++) pairs.push([ds[i-1],ds[i]]);
  const pairTbl = pairs.length? `<div class="tw"><table class="t"><thead><tr><th>Cặp ngày</th><th class="n">Tổng sản lượng</th>${SVC.map(g=>`<th class="n">${g}</th>`).join('')}<th class="n">Điểm quy đổi</th></tr></thead><tbody>${pairs.map(([a,b])=>`<tr><td>${dLabel(a.d)} → ${dLabel(b.d)}</td><td class="n">${fN(a.n)} → ${fN(b.n)}<br>${fDelta(b.n,a.n)}</td>${SVC.map(g=>`<td class="n">${fDelta(b.svc[g],a.svc[g])}</td>`).join('')}<td class="n">${fDelta(b.pts,a.pts,true)}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:8px">So sánh hai ngày tổng lực liền kề trong chuỗi đang chọn. Số liệu thể hiện mức chênh lệch quan sát được, chưa đủ căn cứ để quy nguyên nhân cho chiến dịch.</div>` : `<div class="empty">Cần chọn ít nhất 2 ngày tổng lực để so sánh.</div>`;

  // month chart data (filters except date)
  const dates=DB.dates; const byD=new Map(dates.map(d=>[d,0])); c.Fnd.forEach(r=>byD.set(r.d,(byD.get(r.d)||0)+1));
  const tlV=dates.filter(d=>TL_DAYS.includes(d)).map(d=>byD.get(d)), nonV=dates.filter(d=>!TL_DAYS.includes(d)).map(d=>byD.get(d));
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
  const aTL=avg(tlV), aNon=avg(nonV);

  $('#main').innerHTML=`
    <div class="kpis">${kp}</div>
    ${planNote.length?`<div class="note">${planNote.join(' ')}</div>`:''}
    ${card('Nhận định nổi bật','',`<div class="ins">${insights(ds)}</div>`)}
    <div class="grid g-wide">
      ${card('Diễn biến qua các ngày tổng lực',S.chart1==='sl'?'Sản lượng thuê bao theo ngày, tách theo dịch vụ.':'Điểm quy đổi thực hiện so với điểm kế hoạch ngày; nhãn phụ là tỷ lệ hoàn thành.',`<div class="chart" id="cDays"></div>`,seg('chart1',[['sl','Sản lượng'],['pts','Điểm quy đổi']],S.chart1))}
      ${card('Cơ cấu sản lượng theo dịch vụ','Số thuê bao và tỷ trọng trong phạm vi lọc.',`<div class="chart" id="cDonut"></div>`)}
    </div>
    ${card('Trạng thái hợp đồng','Phân bổ thuê bao theo trạng thái — không mặc định mọi thuê bao đã nghiệm thu hay phát sinh doanh thu.',strip)}
    <div class="grid g2">
      ${card('So sánh các ngày tổng lực liền kề','Mức tăng/giảm tuyệt đối và phần trăm giữa hai ngày tổng lực kế tiếp.',pairTbl)}
      ${card('Ngày tổng lực và ngày thường trong tháng 10','Toàn bộ ngày có dữ liệu, theo các bộ lọc khác (bỏ qua phạm vi ngày). Cột xanh đậm là ngày tổng lực.',`<div class="chart" id="cMonth" style="height:260px"></div><div class="note" style="margin-top:8px">Bình quân/ngày: <b>ngày tổng lực ${aTL==null?'N/A':fN(aTL)}</b> thuê bao (${tlV.length} ngày) · <b>ngày thường ${aNon==null?'N/A':fN(aNon)}</b> thuê bao (${nonV.length} ngày)${aTL!=null&&aNon?` · gấp ${nf1.format(aTL/aNon)} lần`:''}. Đây là so sánh quan sát, chưa loại trừ yếu tố khác.</div>`)}
    </div>`;
  // charts
  const cats=ds.map(o=>dLabel(o.d));
  if(!ds.length){ const el=$('#cDays'); el.innerHTML='<div class="nochart">Không có ngày tổng lực trong phạm vi đang chọn.</div>'; }
  else if(S.chart1==='sl'){ const by={}; SVC.forEach(g=>by[g]=ds.map(o=>o.svc[g])); chartStackSvc('cDays',cats,by,{prev:true}); }
  else chartActPlan('cDays',cats,ds.map(o=>o.pts),ds.map(o=>o.plan),{dec:true,actName:'Điểm thực hiện',planName:'Điểm kế hoạch'});

  chartBars('cMonth',dates.map(dLabel),dates.map(d=>byD.get(d)),{colorFn:(i,v,t)=>TL_DAYS.includes(dates[i])?t.accent:t.neutral,bw:26,
    tip:ps=>{const d=dates[ps[0].dataIndex];return `<b>${dLabelFull(d)}</b> ${TL_DAYS.includes(d)?'· Ngày tổng lực':'· Ngày thường'}<br>${fN(ps[0].value)} thuê bao`;}});

function insights(ds){
  const out=[]; const c=CX;
  const add=(cls,k,html)=>out.push(`<div class="in ${cls}"><span class="mk"></span><div><span class="k">${k}</span>${html}</div></div>`);
  if(ds.length){
    const s=ds.slice().sort((a,b)=>b.n-a.n); const hi=s[0], lo=s[s.length-1];
    add('good','Ngày cao nhất',`<b>${dLabelFull(hi.d)}</b>: ${fN(hi.n)} thuê bao, ${fP(hi.pts)} điểm (${fR(hi.rate)} KH ngày).`);
    if(ds.length>1) add('warn','Ngày thấp nhất',`<b>${dLabelFull(lo.d)}</b>: ${fN(lo.n)} thuê bao, ${fP(lo.pts)} điểm (${fR(lo.rate)} KH ngày) — thấp hơn ngày cao nhất ${fN(hi.n-lo.n)} thuê bao.`);
  } else add('','Ngày tổng lực','Phạm vi đang chọn không có ngày tổng lực.');
  if(ds.length>1){
    const a=ds[0], b=ds[ds.length-1];
    const ch=SVC.map(g=>({g,a:a.svc[g],b:b.svc[g],d:b.svc[g]-a.svc[g],p:ratio(b.svc[g]-a.svc[g],a.svc[g])})).filter(o=>o.a+o.b>0);
    const up=ch.filter(o=>o.d>0).sort((x,y)=>(y.p??-1)-(x.p??-1))[0];
    const dn=ch.filter(o=>o.d<0).sort((x,y)=>x.p-y.p)[0];
    if(up) add('good','Dịch vụ tăng nổi bật',`<b>${up.g}</b>: ${fN(up.a)} (${dLabel(a.d)}) → ${fN(up.b)} (${dLabel(b.d)}), ${up.p==null?'N/A':'+'+nf1.format(up.p*100)+'%'}.`);
    if(dn) add('bad','Dịch vụ suy giảm',`<b>${dn.g}</b>: ${fN(dn.a)} (${dLabel(a.d)}) → ${fN(dn.b)} (${dLabel(b.d)}), ${nf1.format(dn.p*100)}%.`);
  }
  const sc=svcCompletion().filter(o=>o.p>0).sort((a,b)=>a.rate-b.rate);
  if(sc.length) add(rateCls(sc[0].rate),'Dịch vụ hoàn thành thấp nhất',`<b>${sc[0].g}</b>: ${fN(sc[0].a)}/${fN(sc[0].p)} thuê bao kế hoạch (${fR(sc[0].rate)}). ${sc.length>1?`Cao nhất: ${sc[sc.length-1].g} ${fR(sc[sc.length-1].rate)}.`:''}`);
  const AS=c.areaStats.filter(o=>o.inPlan);
  const lead=AS.slice().sort((a,b)=>b.ptsTL-a.ptsTL)[0];
  if(lead&&lead.ptsTL>0) add('good','Dẫn đầu điểm quy đổi',`<b>${lead.area}</b>: ${fP(lead.ptsTL)} điểm, đạt ${fR(lead.rate)} kế hoạch.`);
  const withPlan=AS.filter(o=>o.rate!=null).sort((a,b)=>a.rate-b.rate);
  if(withPlan.length){ const w=withPlan[0]; add(rateCls(w.rate),'Hoàn thành thấp nhất',`<b>${w.area}</b>: ${fP(w.ptsTL)}/${fP(w.plan)} điểm (${fR(w.rate)}), thiếu ${fP(Math.max(0,-w.gap))} điểm.`); }
  const q=c.areaStats.filter(o=>o.qual).sort((a,b)=>b.ttRate-a.ttRate);
  if(q.length) add('bad','Cảnh báo thoái trả',`${q.map(o=>`<b>${o.area}</b> ${fR(o.ttRate)} (${fN(o.tt)}/${fN(o.nNs)})`).join(', ')} — vượt ngưỡng ${fR((c.ttRate||0)*1.5)}.`);

  return out.join('');
}

function renderWard(){
  const F=CX.F, N=CX.Fns;
  const wm=new Map();
  for(const r of F){ let o=wm.get(r.ward); if(!o){o={ward:r.ward,n:0,pts:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},areas:new Set(),nNs:0,tt:0,ttt:0};wm.set(r.ward,o);} o.n++; o.pts+=r.pts; o.svc[r.g]++; o.areas.add(r.area); }
  for(const r of N){ let o=wm.get(r.ward); if(!o){o={ward:r.ward,n:0,pts:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},areas:new Set(),nNs:0,tt:0,ttt:0};wm.set(r.ward,o);} o.nNs++; if(r.st===ST_TT)o.tt++; else if(r.st===ST_TTT)o.ttt++; }
  let wards=[...wm.values()].filter(o=>o.n||o.nNs); wards.forEach(o=>{o.nA=o.areas.size;o.areaList=[...o.areas].join(', ');o.rate=ratio(o.tt,o.nNs);});
  const q=fold(S.wardQ); const wShow=q?wards.filter(o=>fold(o.ward).includes(q)):wards;
  if(S.wardSel&&!wm.has(S.wardSel)) S.wardSel=null;
  const wCols=[
    {k:'ward',t:'Phường lắp đặt',f:r=>`<b>${esc(r.ward)}</b>`},
    {k:'n',t:'Tổng SL',num:true,f:r=>fN(r.n)},
    ...SVC.map(g=>({k:'w'+g,t:g,num:true,v:r=>r.svc[g],f:r=>fN(r.svc[g])})),
    {k:'pts',t:'Điểm QĐ',num:true,f:r=>fP(r.pts)},
    {k:'nA',t:'Số địa bàn',num:true,f:r=>`<span title="${esc(r.areaList)}">${r.nA}</span>`},
    {k:'tt',t:'Thoái trả',num:true,f:r=>fN(r.tt)},
    {k:'rate',t:'Tỷ lệ TT',num:true,f:r=>fR(r.rate)+(r.nNs<15?' <span class="badge na">mẫu nhỏ</span>':''),cls:r=>r.nNs>=15&&r.rate>=1.5*(CX.ttRate||1)?'cell-bad':''},
  ];
  // streets
  const sRows=S.wardSel?F.filter(r=>r.ward===S.wardSel):F; const sNs=S.wardSel?N.filter(r=>r.ward===S.wardSel):N;
  const sm=new Map(); for(const r of sRows){ const k=r.ws; let o=sm.get(k); if(!o){o={ward:r.ward,street:r.street,n:0,pts:0,svc:{Fiber:0,MyTV:0,Mesh:0,Cam:0},nNs:0,tt:0};sm.set(k,o);} o.n++; o.pts+=r.pts; o.svc[r.g]++; }
  for(const r of sNs){ const o=sm.get(r.ws); if(!o) continue; o.nNs++; if(r.st===ST_TT)o.tt++; }
  const streets=[...sm.values()]; streets.forEach(o=>o.rate=ratio(o.tt,o.nNs));
  const sCols=[
    {k:'ward',t:'Phường',f:r=>esc(r.ward)},{k:'street',t:'Phố',f:r=>`<b>${esc(r.street)}</b>`},
    {k:'n',t:'Tổng SL',num:true,f:r=>fN(r.n)},{k:'mix',t:'Cơ cấu dịch vụ',nosort:true,f:r=>mixBar(r.svc,r.n)},
    {k:'pts',t:'Điểm QĐ',num:true,f:r=>fP(r.pts)},{k:'tt',t:'Thoái trả',num:true,f:r=>fN(r.tt)},{k:'rate',t:'Tỷ lệ TT',num:true,f:r=>fR(r.rate)},
  ];
  const hot=wards.filter(o=>o.nNs>=15&&o.tt>=3).sort((a,b)=>b.rate-a.rate).slice(0,8);
  const lowW=wards.filter(o=>o.n>0&&o.n<=3).length;
  const fiberLow=wards.filter(o=>o.n>=20&&ratio(o.svc.Fiber,o.n)<0.2).sort((a,b)=>b.n-a.n).slice(0,6);
  $('#main').innerHTML=`
    <div class="kpis">${kpi('Số phường có phát sinh',fN(wards.filter(o=>o.n).length),`${fN(new Set(F.map(r=>r.ws)).size)} phố/thôn`,'acc')}${kpi('Phường dẫn đầu',wards.length?esc(wards.slice().sort((a,b)=>b.n-a.n)[0].ward):'N/A',wards.length?fN(wards.slice().sort((a,b)=>b.n-a.n)[0].n)+' thuê bao':'')}${kpi('Phường ≤ 3 thuê bao',fN(lowW),'sản lượng rất thấp trong phạm vi')}${kpi('Điểm nóng thoái trả',fN(hot.filter(o=>o.rate>=1.5*(CX.ttRate||1)).length),'phường ≥ 15 thuê bao, tỷ lệ ≥ 1,5× toàn mạng',hot.some(o=>o.rate>=1.5*(CX.ttRate||1))?'bad':'')}</div>
    <div class="grid g2">
      ${card('Bảng xếp hạng phường','Bấm một phường để xem các phố thuộc phường đó.',sortTable('tblWard',wCols,wShow,{key:'n',dir:'desc',scroll:true,rowClick:'ward',selKey:{k:'ward',v:S.wardSel}}),`<div class="toolbar"><input type="search" id="wardQ" placeholder="Tìm phường…" value="${esc(S.wardQ)}" aria-label="Tìm phường"></div>`)}
      ${card(S.wardSel?`Phố thuộc ${esc(S.wardSel)}`:'Bảng xếp hạng phố (toàn phạm vi)',S.wardSel?'':'Chọn một phường ở bảng bên để lọc.',sortTable('tblStreet',sCols,streets,{key:'n',dir:'desc',scroll:true,limit:S.wardSel?0:100}),S.wardSel?`<button class="btn sm" data-act="wardClear">Bỏ chọn phường</button>`:'')}
    </div>
    <div class="grid g-wide">
      ${card('Phân tầng địa bàn › phường','Diện tích ô theo sản lượng. Bấm một địa bàn để đi sâu vào các phường; dùng thanh điều hướng phía trên để quay lại.',`<div class="chart tall" id="cTree"></div>`)}
      ${card('Điểm nóng và khu vực cần khai thác','Chỉ dựa trên dữ liệu phát sinh; file không có quy mô thị trường nên chưa đánh giá được độ phủ.',`
        <div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin-bottom:6px">Thoái trả cao nhất (≥ 15 thuê bao)</div>
        ${hot.length?barList(hot.map(o=>({label:o.ward,n:o.tt,extra:`TT / ${fN(o.nNs)} thuê bao = <b>${fR(o.rate)}</b>`,color:'var(--bad)'})),{noPct:true}):'<div class="empty">Không có phường đủ mẫu</div>'}
        <div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:14px 0 6px">Phường sản lượng lớn nhưng tỷ trọng Fiber &lt; 20%</div>
        ${fiberLow.length?barList(fiberLow.map(o=>({label:o.ward,n:o.svc.Fiber,extra:`Fiber / ${fN(o.n)} thuê bao = <b>${fR(ratio(o.svc.Fiber,o.n))}</b>`,color:'var(--s1)'})),{noPct:true}):'<div class="empty">Không có</div>'}`)}
    </div>
    ${crossCard('wardX','Ma trận nhiệt phường','20 phường sản lượng lớn nhất theo ngày tổng lực, dịch vụ hoặc địa bàn.',F,'ward',['day','g','area'],{topRows:20})}`;
  // treemap
  const tm=new Map(); for(const r of F){ let a=tm.get(r.area); if(!a){a=new Map();tm.set(r.area,a);} const o=a.get(r.ward)||{n:0,tt:0}; o.n++; if(r.st===ST_TT)o.tt++; a.set(r.ward,o); }
  const data=[...tm.entries()].map(([a,m])=>({name:a,value:[...m.values()].reduce((s,o)=>s+o.n,0),tt:[...m.values()].reduce((s,o)=>s+o.tt,0),children:[...m.entries()].map(([w,o])=>({name:w,value:o.n,tt:o.tt}))})).sort((a,b)=>b.value-a.value);
  if(data.length) chartTreemap('cTree',data); else $('#cTree').innerHTML='<div class="nochart">Không có dữ liệu</div>';
}

function findSheet(wb,key){ const k=fold(key); return wb.SheetNames.find(n=>fold(n)===k) || wb.SheetNames.find(n=>fold(n).includes(k)); }
async function importFile(f){
  if(!SESSION||SESSION.role!=='admin'){ toast('Chỉ tài khoản admin được nạp dữ liệu.'); return; }
  if(!window.XLSX){ toast('Không tải được thư viện đọc Excel (cần kết nối Internet).'); return; }
  busy(true);
  try{
    const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const sd=findSheet(wb,'Chi tiết'), sp=findSheet(wb,'Kế hoạch'), sq=findSheet(wb,'Quy đổi');
    if(!sd) throw new Error('Không tìm thấy sheet “Chi tiết”.');
    if(!sp||!sq) toast('Thiếu sheet '+(!sp?'“Kế hoạch” ':'')+(!sq?'“Quy đổi”':'')+' — các phần liên quan sẽ không tính được.');
    const read=n=>n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
    const raw={source:f.name,detail:read(sd),plan:read(sp),conv:read(sq),loadedAt:new Date()};
    const db=normalize(raw); if(!db.rows.length) throw new Error('Không có thuê bao hợp lệ trong sheet Chi tiết.');
    RAW=raw; DB=db; S.f=freshFilters(); S.from=''; S.to=''; S.areaSel=null; S.wardSel=null; Object.keys(TABLES).forEach(k=>delete TABLES[k]);
    renderAll(); toast(`Đã nạp ${f.name}: ${fN(DB.chk.nValid)}/${fN(DB.chk.nRead)} dòng hợp lệ`);
  }catch(e){ console.error(e); toast('Không đọc được file: '+e.message); }
  busy(false);
}

async function saveBlob(blob,filename){
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){ dl=null; }
  if(dl){ try{ await dl.save({filename,data:blob}); toast('Đã lưu '+filename); }catch(e){ toast(e&&e.code==='declined'?'Đã hủy lưu file':'Không lưu được file'+(e&&e.message?': '+e.message:'')); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); toast('Đã xuất '+filename);
}
function stamp(){ const d=new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }

/* ============ AUTH, ENCRYPTED PAYLOAD, ADMIN BUILD ============ */
const PRISTINE = document.getElementById('app').innerHTML;
const FONT_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">';
const LIB_TAGS = '<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"><\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n';
// Tài khoản: chỉ lưu mã băm SHA-256 của "tên:mật khẩu"
const USERS = {
  'nstg.hpg': {role:'viewer', h:'27da04a4b7d857d0561deb1bbdcd50c51f1b55ec801e02a24c525790c1cdc2a2'},
  'admin':    {role:'admin',  h:'bdd8d1253d81b210be056b9fe2d27231dc425b3d890da6d5c326f408617b9270'},
};
const PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
let SESSION = null; // {u, role, key}
const SS_KEY = 'tl-dash-session';

/* SHA-256 + mã hóa dòng (keystream SHA-256 theo bộ đếm) — thuần JS, chạy được cả trên http */
const sha256=(function(){
  const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const W=new Uint32Array(64);
  return function(msg){
    const l=msg.length, nb=((l+9+63)>>6)<<6; const m=new Uint8Array(nb); m.set(msg); m[l]=0x80;
    const bits=l*8; m[nb-4]=bits>>>24; m[nb-3]=(bits>>>16)&255; m[nb-2]=(bits>>>8)&255; m[nb-1]=bits&255; m[nb-5]=Math.floor(l/0x20000000)&255;
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    for(let o=0;o<nb;o+=64){
      for(let i=0;i<16;i++) W[i]=(m[o+i*4]<<24)|(m[o+i*4+1]<<16)|(m[o+i*4+2]<<8)|m[o+i*4+3];
      for(let i=16;i<64;i++){ const a=W[i-15],b=W[i-2]; W[i]=(W[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+W[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10)))|0; }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(let i=0;i<64;i++){ const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+W[i])|0; const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
      h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0;
    }
    const out=new Uint8Array(32); [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v,i)=>{ out[i*4]=v>>>24; out[i*4+1]=(v>>>16)&255; out[i*4+2]=(v>>>8)&255; out[i*4+3]=v&255; }); return out;
  };
})();
const u8=s=>new TextEncoder().encode(s);
const cat=(...arrs)=>{ const n=arrs.reduce((s,a)=>s+a.length,0); const o=new Uint8Array(n); let p=0; arrs.forEach(a=>{o.set(a,p);p+=a.length;}); return o; };
const toHex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const fromHex=h=>{ const o=new Uint8Array(h.length/2); for(let i=0;i<o.length;i++) o[i]=parseInt(h.substr(i*2,2),16); return o; };
const toB64=b=>{ let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
const fromB64=t=>{ const s=atob(t); const o=new Uint8Array(s.length); for(let i=0;i<s.length;i++) o[i]=s.charCodeAt(i); return o; };
function randBytes(n){ const o=new Uint8Array(n); if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(o); else for(let i=0;i<n;i++) o[i]=Math.random()*256|0; return o; }
function deriveKey(pass){ const salt=fromHex(PAYLOAD.salt); let k=sha256(cat(salt,u8(pass))); for(let i=0;i<PAYLOAD.iter;i++) k=sha256(cat(k,salt)); return k; }
function xorStream(data,key,iv){ const out=new Uint8Array(data.length); const blk=new Uint8Array(key.length+iv.length+4); blk.set(key); blk.set(iv,key.length); const p=key.length+iv.length;
  for(let i=0,c=0;i<data.length;i+=32,c++){ blk[p]=c>>>24; blk[p+1]=(c>>>16)&255; blk[p+2]=(c>>>8)&255; blk[p+3]=c&255; const ks=sha256(blk); const n=Math.min(32,data.length-i); for(let j=0;j<n;j++) out[i+j]=data[i+j]^ks[j]; } return out; }
const verifier=key=>toHex(sha256(cat(key,u8('verify'))));
function decryptPayload(key){
  if(verifier(key)!==PAYLOAD.ver) throw new Error('wrong key');
  const pt=xorStream(fromB64(PAYLOAD.ct),key,fromHex(PAYLOAD.iv));
  return JSON.parse(new TextDecoder().decode(pt));
}
function encryptPayload(obj,key){ const iv=randBytes(16); return {v:2,iter:PAYLOAD.iter,salt:PAYLOAD.salt,ver:verifier(key),iv:toHex(iv),ct:toB64(xorStream(u8(JSON.stringify(obj)),key,iv))}; }
/* compact column encoding (same shape as the embedded data) */
function fmtCell(v){ if(v instanceof Date && !isNaN(v)) return `${pad(v.getDate())}/${pad(v.getMonth()+1)}/${v.getFullYear()} ${pad(v.getHours())}:${pad(v.getMinutes())}:${pad(v.getSeconds())}`; return v===undefined?null:v; }
function encodeRaw(raw){
  const header=(raw.detail[0]||[]).map(fmtCell); const body=raw.detail.slice(1).filter(r=>r&&r.some(v=>v!=null&&v!==''));
  const cols=header.map((_,j)=>{ const u=[], ix=new Map(), i=[]; for(const r of body){ const v=fmtCell(r[j]); const k=JSON.stringify(v); if(!ix.has(k)){ ix.set(k,u.length); u.push(v); } i.push(ix.get(k)); } return {u,i}; });
  const m=a=>(a||[]).map(r=>(r||[]).map(fmtCell));
  return {source:raw.source, header, n:body.length, cols, plan:m(raw.plan), conv:m(raw.conv)};
}
function buildHtml(payloadObj){
  const css=document.getElementById('app-css').textContent;
  const js=document.getElementById('app-js').textContent;
  const pj=JSON.stringify(payloadObj).replace(/</g,'\\u003c');
  return `<!doctype html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>${esc(document.title)}</title>\n${FONT_LINKS}\n<style id="app-css">${css}</style>\n</head>\n<body>\n<div id="app">${PRISTINE}</div>\n${LIB_TAGS}<script type="application/json" id="payload">${pj}<\/script>\n<script id="app-js">${js}<\/script>\n</body>\n</html>\n`;
}
async function buildFile(){
  if(!SESSION||SESSION.role!=='admin'){ toast('Chỉ tài khoản admin được tạo file.'); return; }
  busy(true);
  try{
    const enc=encodeRaw(RAW);
    const html=buildHtml(encryptPayload(enc,SESSION.key));
    const name=`Dashboard_TongLuc_${stamp()}.html`;
    await saveBlob(new Blob([html],{type:'text/html;charset=utf-8'}),name);
  }catch(e){ console.error(e); toast('Không tạo được file: '+e.message); }

}

function applyRole(){

function startDashboard(data){

}
function logout(){
  SESSION=null; try{ sessionStorage.removeItem(SS_KEY); }catch(e){}

  $('#dash').hidden=true; $('#login').hidden=false; $('#lgPass').value=''; $('#lgErr').hidden=true; $('#lgUser').focus();
}
function loginErr(msg){ const e=$('#lgErr'); e.textContent=msg; e.hidden=false; }
$('#loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const u=$('#lgUser').value.trim(), p=$('#lgPass').value;
  const acc=USERS[u];
  if(!acc || toHex(sha256(u8(u+':'+p)))!==acc.h){ loginErr('Tên đăng nhập hoặc mật khẩu không đúng.'); return; }
  const btn=$('#lgBtn'); btn.disabled=true; btn.textContent='Đang mở dữ liệu…';
  setTimeout(()=>{
    try{
      const key=deriveKey(p); const data=decryptPayload(key);

      startDashboard(data);
    }catch(err){ console.error(err); loginErr('Không giải mã được dữ liệu bằng mật khẩu này.'); }

});

(function init(){
  try{
    const s=JSON.parse(sessionStorage.getItem(SS_KEY)||'null');
    if(s&&USERS[s.u]&&USERS[s.u].role===s.role){ const key=fromHex(s.k); const data=decryptPayload(key); SESSION={u:s.u,role:s.role,key}; startDashboard(data); return; }
  }catch(e){ try{ sessionStorage.removeItem(SS_KEY); }catch(_){} }
  $('#lgUser').focus();
})();
